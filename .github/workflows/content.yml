name: Validate Folio content
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/validate-content.cjs'
      - 'scripts/check-frontend.cjs'
      - .github/workflows/content.yml
  pull_request:
    paths:
      - docs/feed/**
      - scripts/validate-content.cjs
      - .github/workflows/content.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate online JSON feed
        run: node scripts/validate-content.cjs
      - name: Validate frontend JavaScript and navigation contracts
        run: node scripts/check-frontend.cjs
