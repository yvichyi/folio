name: Folio Native UI Smoke
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/native-ui-smoke.yml'
      - 'android/app/src/main/java/com/folio/dailyenglish/MainActivity.java'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Prepare virtualization
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Emulator installation and real launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash scripts/native-ui-smoke.sh
      - name: Upload captured real Android screens
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: folio-native-screen-evidence
          path: native-witness/
          if-no-files-found: warn
          retention-days: 14
