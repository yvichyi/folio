plugins {
    id 'com.android.application'
}
android {
    namespace 'com.folio.dailyenglish'
    compileSdk 35
    defaultConfig {
        applicationId 'com.folio.dailyenglish.nativepreview'
        minSdk 26
        targetSdk 34
        versionCode 4
        versionName '0.4.0-native'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
