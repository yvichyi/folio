<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f6f3ed" /><meta name="color-scheme" content="light" />
  <meta name="description" content="Folio — 每日英语外刊与深度阅读" />
  <title>Folio — 每日英语外刊</title>
  <link rel="stylesheet" href="style.css?v=4" />
</head>
<body>
<div id="app">
  <main id="main" aria-live="polite"></main>
  <nav id="nav" class="bottom-nav" aria-label="主导航">
    <button class="nav-item selected" data-nav="home" aria-label="今日"><span class="nav-symbol">⌂</span><span>今日</span></button>
    <button class="nav-item" data-nav="explore" aria-label="发现"><span class="nav-symbol">⌕</span><span>发现</span></button>
    <button class="nav-item" data-nav="words" aria-label="词库"><span class="nav-symbol">▧</span><span>词库</span></button>
    <button class="nav-item" data-nav="profile" aria-label="我的"><span class="nav-symbol">◌</span><span>我的</span></button>
  </nav>
  <div id="wordOverlay" class="overlay" aria-hidden="true"><div class="overlay-backdrop" data-action="close-word"></div><section class="word-sheet" role="dialog" aria-modal="true" aria-label="单词详情" id="wordBody"></section></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</div>
<script src="app.js?v=4" defer></script>
</body>
</html>
